<svg width="360" height="540" xmlns="http://www.w3.org/2000/svg">
  <!-- Card Border -->
  <rect x="5" y="5" width="350" height="530" stroke="black" stroke-width="2" fill="none"/>

  <!-- Top and Bottom Borders -->
  <line x1="10" y1="50" x2="350" y2="50" stroke="gray" stroke-width="2"/>
  <line x1="10" y1="490" x2="350" y2="490" stroke="gray" stroke-width="2"/>

  <!-- Side Borders -->
  <line x1="175" y1="55" x2="175" y2="485" stroke="gray" stroke-width="2"/>
  
  <!-- Inner Grid -->
  <g fill="none" stroke="lightgray" stroke-dasharray="5,5">
    <!-- Horizontal Lines -->
    <line x1="15" y1="60" x2="345" y2="60" stroke-width="0.5"/>
    <line x1="15" y1="100" x2="345" y2="100" stroke-width="0.5"/>
    <!-- Add more lines as needed -->

    <!-- Vertical Lines -->
    <line x1="20" y1="65" x2="20" y2="485" stroke-width="0.5"/>
    <line x1="60" y1="65" x2="60" y2="485" stroke-width="0.5"/>
    <!-- Add more lines as needed -->
  </g>
  
  <!-- Text Placeholder -->
  <text x="180" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="black">Card Name</text>

  <!-- Add other elements like icons or illustrations as needed -->
</svg>