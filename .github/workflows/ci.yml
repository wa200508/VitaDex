name: CI

on:
  pull_request:
  push:
    branches: [main, work]

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Compile Python sources
        run: python -m py_compile main.py database.py identification.py journal.py download_models.py scripts/sync_card_db.py

      - name: Run tests
        run: python -m pytest
