name: CI

on:
  pull_request:
  push:
    branches: [main, work, development/readme-android]

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Download local identification model
        run: python download_identification_model.py

      - name: Lint
        run: python -m ruff check .

      - name: Compile Python sources
        run: python -m compileall -q main.py build_identity.py database.py identification.py journal.py local_model.py photos.py scan_jobs.py android_photos.py download_identification_model.py download_models.py scripts tests

      - name: Run tests
        run: python -m pytest
