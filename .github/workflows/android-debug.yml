name: Android test APK

on:
  push:
    branches: [development/readme-android]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Debug APK (${{ matrix.arch }})
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      APP_ANDROID_SKIP_UPDATE: 'True'
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64-v8a]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare isolated SDK with compatible build tools
        run: |
          export APP_ANDROID_SDK_PATH="$RUNNER_TEMP/vitadex-build-sdk"
          echo "APP_ANDROID_SDK_PATH=$APP_ANDROID_SDK_PATH" >> "$GITHUB_ENV"
          mkdir -p "$APP_ANDROID_SDK_PATH"
          sdkmanager --sdk_root="$APP_ANDROID_SDK_PATH" --licenses < <(yes)
          sdkmanager --sdk_root="$APP_ANDROID_SDK_PATH" \
            'cmdline-tools;12.0' 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          # Buildozer 1.6 expects the older tools/bin path. Use a Java 17-compatible SDK manager.
          ln -s cmdline-tools/12.0 "$APP_ANDROID_SDK_PATH/tools"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip ant autoconf automake libtool \
            pkg-config cmake build-essential ccache libffi-dev libssl-dev \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5
      - name: Install pinned build tools
        run: python -m pip install buildozer==1.6.0 Cython==0.29.37 setuptools==70.3.0
      - name: Build testing APK
        env:
          VITADEX_ARCH: ${{ matrix.arch }}
          VITADEX_BUILD_NUMBER: ${{ github.run_number }}
          APP_ANDROID_ACCEPT_SDK_LICENSE: 'True'
        run: bash scripts/build_debug_apk.sh
      - name: Upload testing download
        uses: actions/upload-artifact@v4
        with:
          name: vitadex-test-${{ matrix.arch }}-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
      - name: Download instructions
        run: |
          echo 'Testing snapshot only; no GitHub release or tag is created.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download this run’s artifact. Use x86_64 for the Ubuntu emulator, arm64-v8a for a phone.' >> "$GITHUB_STEP_SUMMARY"
          echo 'See UBUNTU_EMULATOR.md in the download for installation instructions.' >> "$GITHUB_STEP_SUMMARY"
