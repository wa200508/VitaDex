[project]
name = "vitadex"
version = "0.1.0"
description = "A pocket field guide for cataloging and exploring living systems."
requires-python = ">=3.11,<3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["F"]
